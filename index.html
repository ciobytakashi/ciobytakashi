<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — CiobyTakashi</title><link rel="stylesheet" href="/assets/styles.css"></head><body><header class="site-header"><a class="brand" href="/">CiobyTakashi<span>Private publishing</span></a><a class="quiet-link" href="/">View website</a></header><main class="admin-wrap"><section class="admin-intro"><p class="eyebrow">PRIVATE WORKSPACE</p><h1>Content studio</h1><p class="muted">Only the authorized administrator can create and manage content.</p></section><section class="admin-panel"><h2 id="form-heading">Create a discovery</h2><form id="post-form"><input type="hidden" id="post-id"><label>Title<input id="title" required maxlength="120" placeholder="A clear, useful title"></label><label>Short description<textarea id="excerpt" rows="2" maxlength="240" placeholder="A short introduction"></textarea></label><label>Category<select id="category" required><option value="">Choose a category</option><option>Beauty &amp; Care</option><option>Home &amp; Living</option><option>Tech &amp; Essentials</option></select></label><label>Article content<textarea id="body" rows="9" placeholder="Write your article here. Plain text is supported."></textarea></label><label>Featured image<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><p id="upload-status" class="muted"></p><label>Image URL<input id="image-url" placeholder="Uploaded image URL appears here"></label><label>Affiliate link (optional)<input id="affiliate-url" type="url" placeholder="https://…"></label><div class="form-actions"><button class="button button-secondary" type="button" id="save-draft">Save draft</button><button class="button" type="submit">Publish</button><button class="button button-text" type="button" id="reset-form">Clear</button></div><p id="form-message" role="status" class="muted"></p></form></section><section class="admin-panel"><div class="section-heading"><h2>Your content</h2><button class="button button-secondary" id="refresh">Refresh</button></div><div id="admin-posts" class="admin-post-list">Loading…</div></section></main><script src="/assets/admin.js"></script></body></html>
